<!DOCTYPE html><html lang="en"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Single-File Video Chat</title> <!-- Bugout handles serverless peer connectivity via public WebTorrent trackers --> <script src="https://jsdelivr.net"></script> <style> body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #111; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; } #status { background: #222; padding: 12px; text-align: center; font-weight: 500; border-bottom: 1px solid #333; } .video-grid { flex: 1; display: flex; background: #000; } video { width: 50%; height: 100%; object-fit: cover; background: #1a1a1a; border: 1px solid #222; } .controls { background: #222; padding: 20px; display: flex; justify-content: center; gap: 15px; border-top: 1px solid #333; } button { padding: 14px 28px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; } button:hover { opacity: 0.9; } #startBtn { background: #28a745; color: white; } #skipBtn { background: #dc3545; color: white; display: none; } </style></head><body> <div id="status">Allow camera access and click 'Start Chat'</div> <div class="video-grid"> <video id="localVideo" autoplay playsinline muted></video> <video id="remoteVideo" autoplay playsinline></video> </div> <div class="controls"> <button id="startBtn">Start Chat</button> <button id="skipBtn">Next Stranger</button> </div> <script> const localVideo = document.getElementById('localVideo'); const remoteVideo = document.getElementById('remoteVideo'); const startBtn = document.getElementById('startBtn'); const skipBtn = document.getElementById('skipBtn'); const statusDiv = document.getElementById('status'); let localStream = null; let peerConnection = null; let bgt = null; // Public STUN server to bypass standard home firewalls const rtcConfig = { iceServers: [{ urls: 'stun:://google.com' }] }; // Change this string to your own secret key if you want a private user pool const ROOM_IDENTIFIER = "omegle_clone_public_pool_v1"; // Automatically request camera on page load async function initCamera() { try { localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); localVideo.srcObject = localStream; statusDiv.innerText = "Camera ready. Click 'Start Chat' to match."; } catch (err) { statusDiv.innerText = "Error: Webcam access is required to use this application."; startBtn.disabled = true; } } initCamera(); // Join the matchmaking network startBtn.addEventListener('click', () => { startBtn.style.display = 'none'; skipBtn.style.display = 'inline-block'; findStranger(); }); // Skip to a new person skipBtn.addEventListener('click', () => { disconnectPeer(); findStranger(); }); function findStranger() { statusDiv.innerText = "Searching for a stranger..."; // Initialize Bugout instance joining our specific pool identifier bgt = new Bugout(ROOM_IDENTIFIER); // Once connected to the signaling swarm, look for active peers bgt.on("connections", (count) => { if (count > 0 && !peerConnection) { const addresses = Object.keys(bgt.connections); // Pick the first available peer address in the swarm randomly const targetPeer = addresses[0]; statusDiv.innerText = "Connecting to stranger..."; setupWebRTC(targetPeer, true); } }); // Listen for incoming WebRTC signal data from other users bgt.on("message", (address, message) => { if (!peerConnection) setupWebRTC(address, false); handleSignal(message); }); } // Initialize WebRTC Configuration function setupWebRTC(targetAddress, isInitiator) { peerConnection = new RTCPeerConnection(rtcConfig); // Bind your microphone and camera to the connection localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream)); // Display the stranger's feed when received peerConnection.ontrack = (event) => { if (event.streams && event.streams[0]) { remoteVideo.srcObject = event.streams[0]; statusDiv.innerText = "Connected! Say hello to the stranger."; } }; // Send local network path configuration to the other user peerConnection.onicecandidate = (event) => { if (event.candidate) { bgt.send(targetAddress, { candidate: event.candidate }); } }; // If you are the first caller, generate a connection offer if (isInitiator) { peerConnection.createOffer() .then(offer => peerConnection.setLocalDescription(offer)) .then(() => { bgt.send(targetAddress, { sdp: peerConnection.localDescription }); }); } } // Process signaling data exchange async function handleSignal(data) { try { if (data.sdp) { await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp)); if (peerConnection.remoteDescription.type === "offer") { const answer = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answer); bgt.send({ sdp: peerConnection.localDescription }); } } else if (data.candidate) { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } } catch (e) { console.error("Signaling error", e); } } function disconnectPeer() { if (peerConnection) { peerConnection.close(); peerConnection = null; } if () { bgt.destroy(); bgt = null; } remoteVideo.srcObject = null; } </script></body></html>
