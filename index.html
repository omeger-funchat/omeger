                            <button onclick="startQueue('text')" class="flex items-center justify-center px-8 py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold transition shadow-lg shadow-blue-600/20 gap-3">
                                <i data-lucide="message-square" class="w-5 h-5"></i> Text Chat Only
                            </button>
                            <button onclick="startQueue('video')" class="flex items-center justify-center px-8 py-4 bg-purple-600 hover:bg-purple-500 rounded-2xl font-bold transition shadow-lg shadow-purple-600/20 gap-3">
                                <i data-lucide="video" class="w-5 h-5"></i> Video & Audio Chat
                            </button>
                        </div>
                    </div>
                </div>

                <!-- QUEUE SUB-VIEW -->
                <div id="subview-queue" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center space-y-4">
                    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-indigo-500 border-solid"></div>
                    <p class="text-lg font-medium text-slate-300">Searching for matching partner...</p>
                    <button onclick="cancelQueue()" class="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition">Cancel Search</button>
                </div>

                <!-- CHAT SUB-VIEW -->
                <div id="subview-chat" class="hidden flex-1 flex flex-col h-full overflow-hidden">
                    <!-- Chat Top Bar -->
                    <div class="flex justify-between items-center px-6 py-3 bg-slate-900 border-b border-slate-800">
                        <div class="flex items-center gap-2">
                            <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span id="chat-mode-label" class="-bold text-xs uppercase tracking-wider text-slate-300">Mode: Text</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="sendFriendRequest()" class="flex items-center px-3 py-1.5 bg-emerald-600/20 border border-emerald-500/30 hover:bg-emerald-600/30 text-emerald-400 rounded-xl font-semibold text-xs transition gap-1.5">
                                <i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Add Friend
                            </button>
                            <button onclick="handleNextPartner()" class="flex items-center px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-semibold text-xs transition gap-1.5 shadow-md shadow-rose-600/20">
                                <i data-lucide="skip-forward" class="w-3.5 h-3.5"></i> Next / Skip
                            </button>
                        </div>
                    </div>

                    <!-- Chat Body Layout -->
                    <div class="flex-1 flex overflow-hidden">
                        <!-- Video Grid Container -->
                        <div id="video-container" class="hidden w-1/2 grid grid-rows-2 gap-2 p-2 bg-black border-r border-slate-800">
                            <div class="relative w-full h-full bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center border border-slate-800">
                                <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                                <span class="absolute bottom-2 left-2 px-2 py-0.5 bg-slate-950/70 backdrop-blur text-[10px] font-medium rounded text-slate-300">You</span>
                            </div>
                            <div class="relative w-full h-full bg-slate-900 rounded-xl overflow-hidden flex items-center justify-center border border-slate-800">
                                <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                                <span class="absolute bottom-2 left-2 px-2 py-0.5 bg-slate-950/70 backdrop-blur text-[10px] font-medium rounded text-slate-300">Stranger</span>
                            </div>
                        </div>

                        <!-- Message Box Container -->
                        <div id="messaging-container" class="w-full flex-1 flex flex-col bg-slate-950">
                            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">
                                <!-- Messages injected dynamically -->
                            </div>
                            <form id="chat-form" onsubmit="submitChatMessage(event)" class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2">
                                <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 px-4 py-2.5 bg-slate-950 rounded-xl border border-slate-700 focus:outline-none focus:border-indigo-500 text-sm text-slate-200" autocomplete="off">
                                <button type="submit" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl flex items-center justify-center transition shadow-md shadow-indigo-600/20"><i data-lucide="send" class="w-4 h-4"></i></button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Right Sidebar: Friends List & Auth Hub -->
            <div class="w-72 bg-slate-900 border-l border-slate-800 flex flex-col">
                <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                    <h3 class="font-bold text-slate-200 flex items-center gap-2 text-sm"><i data-lucide="users" class="w-4 h-4 text-indigo-400"></i> Friends Hub</h3>
                    <div id="auth-action-icon">
                        <button onclick="toggleAuthModal(true)" title="Login / Signup" class="text-xs px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold transition text-white">Login</button>
                    </div>
                </div>
                <div class="p-3 border-b border-slate-800 bg-slate-900/50">
                    <div id="user-display-email" class="text-xs font-medium text-slate-400 truncate">Browsing as Guest (Chat Free)</div>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-2">
                    <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Friends Online (0)</div>
                    <div id="friends-list-container" class="space-y-1">
                        <p class="text-xs text-slate-500 italic">Log in to unlock friend lists and persistent profiles.</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        const BACKEND_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://your-backend-service.railway.app';
        let socket = null;
        let currentUser = null;
        let authMode = 'login';
        let currentChatMode = 'text';
        let currentRoomId = null;
        let lockedGender = null;

        // WebRTC state
        let localStream = null;
        let peerConnection = null;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // DOM Elements
        const authModal = document.getElementById('auth-modal');
        const authForm = document.getElementById('auth-form');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const authSwitchBtn = document.getElementById('auth-switch-btn');
        const authSwitchText = document.getElementById('auth-switch-text');
        const emailFieldContainer = document.getElementById('email-field-container');
        const passwordFieldContainer = document.getElementById('password-field-container');
        const codeFieldContainer = document.getElementById('code-field-container');
        
        const subviewLanding = document.getElementById('subview-landing');
        const subviewQueue = document.getElementById('subview-queue');
        const subviewChat = document.getElementById('subview-chat');
        const videoContainer = document.getElementById('video-container');
        const chatMessages = document.getElementById('chat-messages');
        const chatModeLabel = document.getElementById('chat-mode-label');
        const userDisplayEmail = document.getElementById('user-display-email');
        const authActionIcon = document.getElementById('auth-action-icon');
        const genderLockModal = document.getElementById('gender-lock-modal');
        const lockedGenderBadge = document.getElementById('locked-gender-badge');

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            checkGenderLock();
            initializeSocketConnection();
        });

        function checkGenderLock() {
            const savedGender = localStorage.getItem('omegle_locked_gender');
            if (savedGender) {
                lockedGender = savedGender;
                lockedGenderBadge.innerText = lockedGender.toUpperCase();
                genderLockModal.classList.add('hidden');
            } else {
                genderLockModal.classList.remove('hidden');
            }
        }

        window.selectLockedGender = function(gender) {
            lockedGender = gender;
            localStorage.setItem('omegle_locked_gender', gender);
            lockedGenderBadge.innerText = gender.toUpperCase();
            genderLockModal.classList.add('hidden');
            showNotification(`Gender locked as ${gender.toUpperCase()} successfully.`);
        };

        function showNotification(msg) {
            const box = document.getElementById('notification-box');
            document.getElementById('notification-text').innerText = msg;
            box.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('translate-y-[-20px]', 'opacity-0'); }, 10);
            setTimeout(() => {
                box.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => box.classList.add('hidden'), 300);
            }, 3500);
        }

        window.toggleAuthModal = function(show) {
            if (show) authModal.classList.remove('hidden');
            else authModal.classList.add('hidden');
        };

        authSwitchBtn.addEventListener('click', () => {
            if (authMode === 'login') {
                authMode = 'signup';
                authSubmitBtn.innerText = 'Create Account & Send Code';
                authSwitchText.innerHTML = `Already have an account? <button type="button" onclick="switchAuthMode('login')" class="text-indigo-400 font-semibold underline hover:text-indigo-300">Login</button>`;
            } else {
                authMode = 'login';
                authSubmitBtn.innerText = 'Login';
                codeFieldContainer.classList.add('hidden');
                emailFieldContainer.classList.remove('hidden');
                passwordFieldContainer.classList.remove('hidden');
                authSwitchText.innerHTML = `Don't have an account? <button type="button" onclick="switchAuthMode('signup')" class="text-indigo-400 font-semibold underline hover:text-indigo-300">Sign Up</button>`;
            }
            lucide.createIcons();
        });

        window.switchAuthMode = function(mode) {
            authMode = mode;
            if (mode === 'login') {
                authSubmitBtn.innerText = 'Login';
                codeFieldContainer.classList.add('hidden');
                emailFieldContainer.classList.remove('hidden');
                passwordFieldContainer.classList.remove('hidden');
            } else if (mode === 'signup') {
                authSubmitBtn.innerText = 'Create Account & Send Code';
                codeFieldContainer.classList.add('hidden');
                emailFieldContainer.classList.remove('hidden');
                passwordFieldContainer.classList.remove('hidden');
            }
        };

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const code = document.getElementById('auth-code').value;

            try {
                if (authMode === 'signup') {
                    const res = await fetch(`${BACKEND_URL}/api/signup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Signup failed');
                    showNotification('Verification code sent to your email.');
                    authMode = 'verify';
                    emailFieldContainer.classList.add('hidden');
                    passwordFieldContainer.classList.add('hidden');
                    codeFieldContainer.classList.remove('hidden');
                    authSubmitBtn.innerText = 'Verify Code & Activate';
                } else if (authMode === 'verify') {
                    const res = await fetch(`${BACKEND_URL}/api/verify`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, code })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Verification failed');
                    showNotification('Account verified successfully! Please login.');
                    switchAuthMode('login');
                } else {
                    const res = await fetch(`${BACKEND_URL}/api/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Login failed');
                    currentUser = { userId: data.userId, email: data.email };
                    userDisplayEmail.innerText = currentUser.email;
                    authActionIcon.innerHTML = `<button onclick="logoutUser()" title="Logout" class="text-slate-400 hover:text-white transition"><i data-lucide="log-out" class="w-4 h-4"></i></button>`;
                    lucide.createIcons();
                    toggleAuthModal(false);
                    showNotification('Successfully logged in.');
                }
            } catch (err) {
                showNotification(err.message);
            }
        });

        function logoutUser() {
            currentUser = null;
            userDisplayEmail.innerText = 'Browsing as Guest (Chat Free)';
            authActionIcon.innerHTML = `<button onclick="toggleAuthModal(true)" title="Login / Signup" class="text-xs px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold transition text-white">Login</button>`;
            lucide.createIcons();
            showNotification('Logged out successfully.');
        }

        function initializeSocketConnection() {
            socket = io(BACKEND_URL);

            socket.on('matched', async ({ roomId, mode, initiator }) => {
                currentRoomId = roomId;
                subviewQueue.classList.add('hidden');
                subviewLanding.classList.add('hidden');
                subviewChat.classList.remove('hidden');
                chatModeLabel.innerText = `Mode: ${mode.toUpperCase()}`;
                chatMessages.innerHTML = `<div class="text-center text-xs text-slate-500 my-2">Connected with a random partner! Say hello.</div>`;

                if (mode === 'video') {
                    videoContainer.classList.remove('hidden');
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        document.getElementById('local-video').srcObject = localStream;
                        setupPeerConnection(roomId, initiator, localStream);
                    } catch (err) {
                        showNotification('Camera permission denied.');
                    }
                } else {
                    videoContainer.classList.add('hidden');
                }
            });

            socket.on('chat-message', (msg) => {
                appendMessage('partner', msg);
            });

            socket.on('partner-disconnected', () => {
                appendSystemMessage('Partner has disconnected.');
                cleanupWebRTC();
            });

            socket.on('webrtc-offer', async (offer) => {
                if (!peerConnection) return;
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('webrtc-answer', { roomId: currentRoomId, answer });
            });

            socket.on('webrtc-answer', async (answer) => {
                if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            });

            socket.on('webrtc-ice-candidate', async (candidate) => {
                if (peerConnection && candidate) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
            });
        }

        window.startQueue = function(mode) {
            currentChatMode = mode;
            subviewLanding.classList.add('hidden');
            subviewChat.classList.add('hidden');
            subviewQueue.classList.remove('hidden');
            socket.emit('join-queue', { mode, myGender: lockedGender });
        };

        window.cancelQueue = function() {
            socket.emit('skip');
            subviewQueue.classList.add('hidden');
            subviewLanding.classList.remove('hidden');
        };

        window.handleNextPartner = function() {
            cleanupWebRTC();
            socket.emit('skip');
            startQueue(currentChatMode);
        };

        function setupPeerConnection(roomId, initiator, stream) {
            peerConnection = new RTCPeerConnection(rtcConfig);
            stream.getTracks().forEach((track) => peerConnection.addTrack(track, stream));

            peerConnection.ontrack = (event) => {
                document.getElementById('remote-video').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc-ice-candidate', { roomId, candidate: event.candidate });
                }
            };

            if (initiator) {
                peerConnection.createOffer().then((offer) => {
                    peerConnection.setLocalDescription(offer);
                    socket.emit('webrtc-offer', { roomId, offer });
                });
            }
        }

        function cleanupWebRTC() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach((t) => t.stop());
                localStream = null;
            }
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('local-video').srcObject = null;
        }

        window.submitChatMessage = function(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg || !currentRoomId) return;

            socket.emit('chat-message', { roomId: currentRoomId, message: msg });
            appendMessage('me', msg);
            input.value = '';
        };

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `flex ${sender === 'me' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div class="max-w-xs px-4 py-2 rounded-2xl text-sm ${sender === 'me' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none'}">${escapeHTML(text)}</div>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'text-center text-xs text-rose-400 font-semibold my-2';
            div.innerText = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        window.sendFriendRequest = function() {
            if (!currentUser) {
                showNotification('Please log in to add friends.');
                toggleAuthModal(true);
                return;
            }
            showNotification('Friend request sent to active partner.');
        };

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
